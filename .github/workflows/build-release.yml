name: Build and release

on:
  repository_dispatch:
    types: [private_push]
  workflow_dispatch:
    inputs:
      source_branch:
        description: Private AgentIRC branch to build
        required: true
        type: choice
        options:
          - master
          - dev/v2
        default: master

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate private source dispatch
        if: github.event_name == 'repository_dispatch'
        env:
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
          SOURCE_REF: ${{ github.event.client_payload.ref }}
        run: |
          test -n "$SOURCE_SHA"
          test -n "$SOURCE_REF"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_REF" == "refs/heads/master" || \
             "$SOURCE_REF" == "refs/heads/dev/v2" || \
             "$SOURCE_REF" == refs/tags/v* ]]
      - name: Validate manual source branch
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_BRANCH: ${{ github.event.inputs.source_branch }}
        run: |
          [[ "$SOURCE_BRANCH" == "master" || "$SOURCE_BRANCH" == "dev/v2" ]]

  interface:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: KyroXova/AgentIRC
          ref: ${{ github.event.client_payload.sha || github.event.inputs.source_branch || 'master' }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: dashboard
      - run: npx vite build
        working-directory: dashboard
      - uses: actions/upload-artifact@v4
        with:
          name: interface
          path: dashboard/dist
          if-no-files-found: error

  hub:
    needs: [validate, interface]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: KyroXova/AgentIRC
          ref: ${{ github.event.client_payload.sha || github.event.inputs.source_branch || 'master' }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: interface
          path: dashboard/dist
      - name: Stamp hub runtime build
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          short="$(git rev-parse --short=12 "$SOURCE_SHA")"
          epoch="$(git show -s --format=%ct "$SOURCE_SHA")"
          cat > agentirc/build_info.py <<EOF
          """Release build metadata generated by CI."""
          BUILD_ID = "$short"
          BUILD_EPOCH = $epoch
          EOF
      - name: Python package
        run: python -m pip wheel . --no-deps -w out
      - name: Hub runtime bundle
        run: |
          mkdir -p out/hub/conduitirc/dashboard
          cp -R agentirc skills pyproject.toml README.md LICENSE out/hub/conduitirc/
          cp -R dashboard/dist out/hub/conduitirc/dashboard/dist
          cp integrations/docker/Dockerfile.runtime out/hub/conduitirc/Dockerfile
          cp docker-compose.yml out/hub/conduitirc/
          test -s out/hub/conduitirc/Dockerfile
          test -s out/hub/conduitirc/docker-compose.yml
          test -s out/hub/conduitirc/dashboard/dist/index.html
          test -s out/hub/conduitirc/skills/agentirc-handoff/SKILL.md
          WORKSPACES_ROOT=/tmp/conduitirc-workspaces docker compose -f out/hub/conduitirc/docker-compose.yml config -q
          tar -czf out/ConduitIRC-Hub.tar.gz -C out/hub conduitirc
          rm -rf out/hub
      - name: Installer scripts
        run: cp scripts/install-windows.ps1 scripts/install-linux.sh out/
      - uses: actions/upload-artifact@v4
        with:
          name: release-hub
          path: out

  windows:
    needs: [validate, interface]
    runs-on: windows-latest
    env:
      ELECTRON_VERSION: 45.0.0
      APP_URL: ${{ vars.CONDUITIRC_APP_URL }}
      IDENTITY_URL: ${{ vars.CONDUITIRC_IDENTITY_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: KyroXova/AgentIRC
          ref: ${{ github.event.client_payload.sha || github.event.inputs.source_branch || 'master' }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: interface
          path: dashboard/dist
      - uses: actions/cache@v4
        id: electron-windows
        with:
          path: electron.zip
          key: electron-${{ env.ELECTRON_VERSION }}-win32-x64
      - name: Electron runtime
        shell: pwsh
        run: |
          if (-not (Test-Path electron.zip)) {
            Invoke-WebRequest "https://github.com/electron/electron/releases/download/v$env:ELECTRON_VERSION/electron-v$env:ELECTRON_VERSION-win32-x64.zip" -OutFile electron.zip
          }
          Invoke-WebRequest "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile rcedit.exe
      - name: Desktop app
        shell: pwsh
        run: |
          if (-not $env:APP_URL -or -not $env:IDENTITY_URL) { throw 'Set CONDUITIRC_APP_URL and CONDUITIRC_IDENTITY_URL repository variables before creating public desktop builds.' }
          $args = @('scripts/package_desktop.py', '--electron-zip', 'electron.zip', '--rcedit', 'rcedit.exe', '--zip', 'ConduitIRC-Desktop-Windows-x64.zip')
          $args += @('--hosted-url', $env:APP_URL, '--identity-origin', $env:IDENTITY_URL)
          python @args
      - name: Build Windows setup installer
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          $env:PATH += ';C:\Program Files (x86)\NSIS'
          $appDir = (Resolve-Path 'desktop\ConduitIRC-win32-x64').Path
          $iconFile = (Resolve-Path 'branding\logo.ico').Path
          $installer = Join-Path -Path (Get-Location).Path -ChildPath 'ConduitIRC-Setup-Windows-x64.exe'
          makensis "/DAPP_DIR=$appDir" "/DICON_FILE=$iconFile" "/DOUTPUT_FILE=$installer" scripts\ConduitIRC.nsi
          if (-not (Test-Path -LiteralPath $installer) -or (Get-Item -LiteralPath $installer).Length -lt 1MB) {
            throw 'NSIS did not produce the Windows setup installer in the release root.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            ConduitIRC-Setup-Windows-x64.exe
            ConduitIRC-Desktop-Windows-x64.zip

  linux:
    needs: [validate, interface]
    runs-on: ubuntu-latest
    env:
      ELECTRON_VERSION: 45.0.0
      APP_URL: ${{ vars.CONDUITIRC_APP_URL }}
      IDENTITY_URL: ${{ vars.CONDUITIRC_IDENTITY_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: KyroXova/AgentIRC
          ref: ${{ github.event.client_payload.sha || github.event.inputs.source_branch || 'master' }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: interface
          path: dashboard/dist
      - uses: actions/cache@v4
        with:
          path: electron.zip
          key: electron-${{ env.ELECTRON_VERSION }}-linux-x64
      - name: Electron runtime
        run: '[ -f electron.zip ] || curl -fsSL -o electron.zip "https://github.com/electron/electron/releases/download/v$ELECTRON_VERSION/electron-v$ELECTRON_VERSION-linux-x64.zip"'
      - name: Desktop app
        run: |
          [ -n "$APP_URL" ] && [ -n "$IDENTITY_URL" ] || { echo "Set CONDUITIRC_APP_URL and CONDUITIRC_IDENTITY_URL repository variables before creating public desktop builds."; exit 1; }
          set -- scripts/package_desktop.py --platform linux-x64 --electron-zip electron.zip --zip ConduitIRC-Desktop-Linux-x64.tar.gz
          set -- "$@" --hosted-url "$APP_URL" --identity-origin "$IDENTITY_URL"
          python "$@"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: ConduitIRC-Desktop-Linux-x64.tar.gz

  android:
    needs: validate
    runs-on: ubuntu-latest
    env:
      CONDUITIRC_ANDROID_HUB_URL: ${{ vars.CONDUITIRC_APP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: KyroXova/AgentIRC
          ref: ${{ github.event.client_payload.sha || github.event.inputs.source_branch || 'master' }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: npm ci --no-audit --no-fund
        working-directory: dashboard
      - name: Require hosted app for Android release
        run: test -n "$CONDUITIRC_ANDROID_HUB_URL" || { echo "Set CONDUITIRC_APP_URL so the Android app loads the hosted site origin."; exit 1; }
      - run: npx vite build && npx cap sync android
        working-directory: dashboard
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
        working-directory: dashboard/android
      - run: cp dashboard/android/app/build/outputs/apk/debug/app-debug.apk ConduitIRC-Android-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: ConduitIRC-Android-preview.apk

  release:
    needs: [validate, hub, windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: KyroXova/AgentIRC
          ref: ${{ github.event.client_payload.sha || github.event.inputs.source_branch || 'master' }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum -- * > SHA256SUMS
      - name: Require Windows installer
        run: test -s assets/ConduitIRC-Setup-Windows-x64.exe
      - name: Release notes
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          base="https://download.conduitirc.org"
          wheel="$(cd assets && ls *.whl)"
          cat > notes.md <<NOTES
          Built from private AgentIRC commit ${SOURCE_SHA:0:7}.

          ### Install the hub (runs your agents and chats on your computer)
          - **Windows hub:** in PowerShell, run \`[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12; irm $base/install-windows.ps1 | iex\`
          - **Linux:** run \`curl -fsSL $base/install-linux.sh | sh\`

          ### Files
          | File | For | What it is |
          | --- | --- | --- |
          | \`install-windows.ps1\` | Windows | Hub installer (the command above) |
          | \`install-linux.sh\` | Linux | Hub installer (the command above) |
          | \`ConduitIRC-Hub.tar.gz\` | Windows and Linux | Hub bundle the installers download |
          | \`ConduitIRC-Setup-Windows-x64.exe\` | Windows | Per-user desktop installer; adds Start menu shortcut and uninstaller |
          | \`ConduitIRC-Desktop-Windows-x64.zip\` | Windows | Portable desktop app: unzip and run \`ConduitIRC.exe\` |
          | \`ConduitIRC-Desktop-Linux-x64.tar.gz\` | Linux | Desktop app: extract and run \`conduitirc\` |
          | \`ConduitIRC-Android-preview.apk\` | Android | Phone app (unsigned preview build) |
          | \`$wheel\` | Any (Python) | Python package for \`pip install\` |
          | \`SHA256SUMS\` | All | Checksums for every file |
          NOTES
      - name: Publish public download release
        env:
          GH_TOKEN: ${{ secrets.CONDUITIRC_RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Add the CONDUITIRC_RELEASE_TOKEN secret with Contents write access to KyroXova/ConduitIRC."
            exit 1
          fi
          tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" assets/* --repo KyroXova/ConduitIRC --target main --latest \
            --title "ConduitIRC build ${SOURCE_SHA:0:7}" --notes-file notes.md
